name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install GNU diffutils (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! diff --version 2>/dev/null | grep -q 'GNU diffutils'; then
            sudo apt-get update
            sudo apt-get install -y diffutils
          fi

      - name: Install GNU diffutils (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install diffutils
          echo "$(brew --prefix diffutils)/libexec/gnubin" >> $GITHUB_PATH

      - name: Run unit and integration tests
        run: cargo test --all-targets --verbose

      - name: Run documentation tests
        run: cargo test --doc --verbose

      - name: Verify examples build and run
        run: |
          cargo run --example basic
          cargo run --example files
          cargo run --example unified
          cargo run --example sdiff
          cargo run --example hunks

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable toolchain with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run linter (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation with strict warning checks
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  package:
    name: Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify cargo package
        run: cargo package --verbose
