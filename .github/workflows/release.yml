name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --all-targets

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          python3 - << 'EOF'
          import sys

          tag = "${{ steps.tag.outputs.tag }}".strip()
          tag_no_v = tag.lstrip("v")
          targets = [f"## [{tag}]", f"## [{tag_no_v}]"]

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          found = False
          section = []
          for line in lines:
              if not found:
                  if any(line.startswith(p) for p in targets):
                      found = True
                      section.append(line)
              else:
                  if line.startswith("## ["):
                      break
                  section.append(line)

          # Fallback: check unreleased section if the tag was not found directly
          if not found:
              for line in lines:
                  if not found:
                      if line.startswith("## [unreleased]"):
                          found = True
                          section.append(f"## [{tag}]\n")
                  else:
                      if line.startswith("## ["):
                          break
                      section.append(line)

          if not section:
              section = [f"## {tag}\n", f"Release {tag}\n"]

          content = "".join(section).strip()
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(content + "\n")

          print(f"Extracted {len(section)} lines for {tag}")
          EOF

          echo "--- Release Notes ---"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
