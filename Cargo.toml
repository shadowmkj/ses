[package]
name = "ses"
version = "0.0.5"
authors = ["Milan Pramod"]
description = "A high-performance, zero-dependency, linear-space Myers diff engine in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shadowmkj/ses"
readme = "README.md"
edition = "2024"
keywords = ["diff", "myers", "shortest-edit-script", "diffutils", "zero-copy"]
categories = ["algorithms", "development-tools", "text-processing"]
rust-version = "1.85"
include = [
    "/src/**/*",
    "/tests/**/*",
    "/benches/**/*",
    "/examples/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-*",
]

[dependencies]

[dev-dependencies]
criterion = { version = "6.0.0", package = "codspeed-criterion-compat" }

[[bench]]
name = "diff_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.debug]
opt-level = 0
lto = "thin"
debug = true
strip = "none"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
